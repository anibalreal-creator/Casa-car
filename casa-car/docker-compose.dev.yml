version: "3.8"
services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casa_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-casa_car}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  backend:
    build: ./backend
    command: npm run start:dev
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      DATABASE_URL: postgres://${POSTGRES_USER:-casa}:${POSTGRES_PASSWORD:-casa_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-casa_car}
    depends_on:
      - postgres
      - redis
volumes:
  pgdata:
